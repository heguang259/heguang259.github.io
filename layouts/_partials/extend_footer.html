<a href="#top" id="top-link" class="top-link hidden" aria-label="go to top" title="Go to Top (Alt + G)" accesskey="g">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevrons-up">
        <polyline points="17 11 12 6 7 11"></polyline>
        <polyline points="17 18 12 13 7 18"></polyline>
    </svg>
</a>

<script>
    (function () {
        var toplink = document.getElementById("top-link");
        if (!toplink) { return; }

        var ticking = false;

        function update() {
            var y = window.scrollY || document.documentElement.scrollTop || 0;
            toplink.classList.toggle("hidden", y <= window.innerHeight);
            ticking = false;
        }

        window.addEventListener("scroll", function () {
            if (!ticking) {
                ticking = true;
                requestAnimationFrame(update);
            }
        }, { passive: true });

        update();
    })();
</script>

<script>
    (function () {
        var buttons = document.querySelectorAll(".bili-cover");
        if (!buttons.length) { return; }

        Array.prototype.forEach.call(buttons, function (btn) {
            btn.addEventListener("click", function () {
                var bvid = btn.getAttribute("data-bvid");
                if (!bvid) { return; }
                var page = btn.getAttribute("data-p") || "1";
                var iframe = document.createElement("iframe");
                iframe.src = "https://player.bilibili.com/player.html?bvid=" +
                    encodeURIComponent(bvid) + "&page=" + encodeURIComponent(page) +
                    "&high_quality=1&danmaku=0&autoplay=1";
                iframe.setAttribute("scrolling", "no");
                iframe.setAttribute("frameborder", "0");
                iframe.setAttribute("allowfullscreen", "true");
                iframe.setAttribute("title", btn.getAttribute("aria-label") || "视频播放器");
                btn.parentNode.replaceChild(iframe, btn);
            }, { once: true });
        });
    })();
</script>

<script>
    (function () {
        var buttons = document.querySelectorAll(".wv-cover");
        if (!buttons.length) { return; }

        Array.prototype.forEach.call(buttons, function (btn) {
            btn.addEventListener("click", function () {
                var src = btn.getAttribute("data-src");
                if (!src) { return; }

                var video = document.createElement("video");
                video.setAttribute("controls", "controls");
                video.setAttribute("playsinline", "playsinline");
                video.setAttribute("preload", "auto");
                video.setAttribute("src", src);

                var poster = btn.querySelector("img");
                if (poster) { video.setAttribute("poster", poster.getAttribute("src")); }

                video.addEventListener("error", function () {
                    var tip = document.createElement("p");
                    tip.className = "wv-fallback";
                    tip.textContent = "这段视频暂时无法播放。";
                    if (video.parentNode) { video.parentNode.replaceChild(tip, video); }
                });

                btn.parentNode.replaceChild(video, btn);

                var playing = video.play();
                if (playing && playing.catch) { playing.catch(function () { }); }
            }, { once: true });
        });
    })();
</script>
